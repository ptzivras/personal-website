name: Refresh latest DEV article

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-latest-dev
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh static article card
        run: python scripts/update_latest_dev.py
      - name: Commit only changed article content
        run: |
          git add public/index.html public/styles.css data/latest-dev.json
          if git diff --cached --quiet; then
            echo "No article changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh latest DEV article"
          git push origin HEAD:main
